name: Production Source QC

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  source-qc:
    name: Production Source QC
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Build and verify the patched runtime
        run: docker build --target runtime-smoke --progress=plain .
      - run: npm ci
      - name: Install the production tools' exact locked dependency closure
        run: npm ci --prefix infra/google-cloud/dev-040-production-release/migration-runner --omit=dev --ignore-scripts
      - run: npm run test:production-tools
      - run: npm run test:dev-040:tool-rotation
      - name: Build and import isolated production tool images
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          for tool in migration-runner dev057-principal-pair-diagnostic dev057-v4-catalog-readback; do
            image="orgmaster-tool:${tool}"
            docker build --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
              -f "infra/google-cloud/dev-040-production-release/${tool}.Dockerfile" -t "$image" .
            case "$tool" in
              migration-runner) modules='["dev040-production-migration-runner", "dev014-production-lifecycle-readback", "dev049-production-admission-runner", "dev014-production-managed-link-runner", "dev014-production-login-fixture-runner", "dev014-production-login-authority-switch-runner"]' ;;
              *) modules="[\"${tool/dev057-/dev057-production-}-runner\"]" ;;
            esac
            docker run --rm --network none --entrypoint node "$image" --experimental-transform-types \
              --input-type=module -e "for (const name of $modules) await import('./scripts/' + name + '.mjs')"
          done
      - run: npm run test:dev-040:r2
      - run: npm run test:dev-014:lifecycle-readback
      - run: npm run test:dev-040:abort
      - run: npm test -- --testTimeout=30000
      - run: npm run build
      - run: npm exec vitest run server/aiPdmRoleCatalogRepository.test.ts
      - run: npm run check:db-boundary
      - run: npm run qc:dev-040:r2
