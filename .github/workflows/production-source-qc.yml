name: Production Source QC

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  source-qc:
    name: Production Source QC
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:dev-040:r2
      - run: npm exec vitest run server/aiPdmRoleCatalogRepository.test.ts
      - run: npm run check:db-boundary
      - run: npm run build
