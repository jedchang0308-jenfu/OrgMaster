name: Production Source QC

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  source-qc:
    name: Production Source QC
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      dev070-postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: orgmaster-dev070-ci-isolated
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --label jenfu.orgmaster.dev070.run=${{ github.run_id }}
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Select documentation or source verification
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          base = os.environ.get('BASE_SHA', '')
          files = []
          if re.fullmatch(r'[0-9a-f]{40}', base) and base != '0' * 40:
              result = subprocess.run(['git', 'diff', '--no-renames', '--name-only', '-z', base, 'HEAD'], capture_output=True)
              if result.returncode == 0:
                  files = [name for name in result.stdout.split(b'\0') if name]
          docs_only = bool(files) and all(name == b'AGENTS.md' or (name.startswith(b'ai-doc/') and name.endswith(b'.md')) for name in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'docs_only={str(docs_only).lower()}\n')
          if docs_only:
              subprocess.run(['git', 'diff', '--check', base, 'HEAD'], check=True)
          print('Documentation diff checked; source unchanged.' if docs_only else 'Source verification required.')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: npm
      - name: Build and verify the patched runtime
        if: steps.scope.outputs.docs_only != 'true'
        run: docker build --target runtime-smoke --progress=plain .
      - run: npm ci
        if: steps.scope.outputs.docs_only != 'true'
      - name: Install the production tools' exact locked dependency closure
        if: steps.scope.outputs.docs_only != 'true'
        run: npm ci --prefix infra/google-cloud/dev-040-production-release/migration-runner --omit=dev --ignore-scripts
      - name: Verify local owner bootstrap and 046 component SQL on owned PostgreSQL 18
        if: steps.scope.outputs.docs_only != 'true'
        env:
          ORGMASTER_DEV070_PG_CONTAINER_ID: ${{ job.services['dev070-postgres'].id }}
          PGHOST: 127.0.0.1
          PGPORT: 5432
          ORGMASTER_DEV070_PG_PUBLISHED_PORT: ${{ job.services['dev070-postgres'].ports[5432] }}
          PGUSER: postgres
          PGPASSWORD: orgmaster-dev070-ci-isolated
        run: node scripts/qc-dev070-local-administration-owner-postgres.mjs
      - name: Build and import isolated production tool images
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          for tool in migration-runner dev057-principal-pair-diagnostic dev057-v4-catalog-readback; do
            image="orgmaster-tool:${tool}"
            docker build --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
              -f "infra/google-cloud/dev-040-production-release/${tool}.Dockerfile" -t "$image" .
            case "$tool" in
              migration-runner) modules='["dev040-production-migration-runner", "dev070-production-enrollment-intent-runner", "dev014-production-lifecycle-readback", "dev049-production-admission-runner", "dev014-production-managed-link-runner", "dev014-production-login-fixture-runner", "dev014-production-login-authority-switch-runner"]' ;;
              *) modules="[\"${tool/dev057-/dev057-production-}-runner\"]" ;;
            esac
            docker run --rm --network none --entrypoint node "$image" --experimental-transform-types \
              --input-type=module -e "for (const name of $modules) await import('./scripts/' + name + '.mjs')"
          done
      # QC owns contract tests, tool tests, abort tests, DB boundary, app tests and build.
      - run: npm run qc:dev-040:r2
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        env:
          DB_BOUNDARY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
